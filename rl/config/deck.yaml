# IA spécialisée sur un deck (README § 16) : le modèle général continue d'apprendre en ne jouant QUE ce deck, contre
# tous les decks du registre. Chargé automatiquement par --deck (inutile de l'ajouter) :
#   python train.py --config gpu --deck META-ROBIN-2026-10
# Entraînement « deck-<deck> » : checkpoints/deck-META-ROBIN-2026-10/, logs/deck-META-ROBIN-2026-10/.
specialize:
  base: rtx2070-main         # modèle de départ : nom d'entraînement (son dernier point de sauvegarde) ou fichier .pt
  experts_run: "deck-{deck}" # ligue des spécialistes : où trouver l'IA spécialisée de chaque deck adverse
  experts_per_update: 4      # IA spécialisées adverses qui jouent pendant une mise à jour (chacune ralentit un peu)

ppo:
  lr: 0.0001                 # celui de la fin de l'entraînement général

train:
  max_updates: 300           # à prolonger avec --max-updates tant que les évaluations progressent

curriculum:
  levels:
    - name: "deck"
      # les autres IA spécialisées qui jouent leur deck comme il faut (« experts », ligue des spécialistes, relue à
      # chaque évaluation ; un deck qui n'a pas encore la sienne est joué par le modèle général), le modèle général figé
      # (« base » : il joue bien tous les decks), l'IA heuristique (autre façon de jouer), et le modèle lui-même en
      # miroir (même deck des deux côtés : les deux côtés apprennent ce deck)
      opponents: [{kind: experts, weight: 0.35}, {kind: base, weight: 0.25}, {kind: heuristic, weight: 0.3}, {kind: self, weight: 0.1}]
      decks: all                 # decks adverses
      max_updates: 0
      eval_every: 50
      gate:                      # suivi, pas de passage : ce deck contre l'heuristique, le modèle général (repères
        - {opponent: heuristic, min_winrate: 0.0}     # fixes) et les autres IA spécialisées (repère qui monte avec
        - {opponent: base, min_winrate: 0.0}          # leurs progrès)
        - {opponent: experts, min_winrate: 0.0}
      gate_seeds_per_pair: 8     # 15 decks adverses × 8 graines × 2 sièges = 240 parties par adversaire
      consecutive: 1
