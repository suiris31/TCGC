# Bloc à coller DANS le bloc `server { ... }` HTTPS (listen 443) du site existant, puis :
#   sudo nginx -t && sudo systemctl reload nginx
# L'appli devient accessible sur https://<ton-domaine>/tcgc/

# /tcgc sans barre finale -> /tcgc/ (sinon les adresses relatives de l'appli seraient fausses)
location = /tcgc {
    return 301 /tcgc/;
}

# ^~ : ce bloc passe avant les éventuelles règles regex du site (cache des .js, .css, images...)
location ^~ /tcgc/ {
    # la barre finale retire /tcgc/ : l'appli reçoit /api/..., /img/..., /assets/...
    proxy_pass http://127.0.0.1:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # photos envoyées par le scanner
    client_max_body_size 20m;
    proxy_read_timeout 120s;
}
